# Site model settings. See docs/site-format.md for everything that can go here.

[domus]
format = {{format}}          # this site folder's format: `domus site upgrade` moves an older one on
importer = {{importer}}          # where the place came in from: nz, osm, or manual (your own boundary and rasters)

[site]
title = {{name}}
heading = {{name}}
about = {{about}}
attribution = {{attribution}}          # where the data came from, shown in the viewer

[crs]
epsg = {{epsg}}
label = {{crs_label}}
vertical = {{vertical}}          # the heights' datum, as the viewer names it

[model]
# Area modelled (E min, N min, E max, N max) and the viewer's origin (E, N). The viewer works in
# metres east, up and south of the origin; its height comes from the ground unless you add one.
extent = {{extent}}
terrain_step_m = 0.5
origin = {{origin}}
