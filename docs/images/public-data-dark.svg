<path d="M446.0 111.0 H534" stroke="#95a3a9" stroke-width="1.2" stroke-dasharray="2 4"/>
<circle cx="534" cy="111.0" r="3" fill="#43b9d6"/>
<rect x="546" y="81.0" width="392" height="68" rx="10" class="card"/>
<text x="560" y="103.0" font-size="16" class="title">Aerial photo</text>
<text x="560" y="123.0" font-size="13" class="muted" text-anchor="start">What the place looks like from above.</text>
<text x="560" y="140.0" font-size="13" class="muted" text-anchor="start">It's draped over the ground.</text>
<path d="M446.0 217.0 H534" stroke="#95a3a9" stroke-width="1.2" stroke-dasharray="2 4"/>
<circle cx="534" cy="217.0" r="3" fill="#43b9d6"/>
<rect x="546" y="187.0" width="392" height="68" rx="10" class="card"/>
<text x="560" y="209.0" font-size="16" class="title">Surface model</text>
<text x="560" y="229.0" font-size="13" class="muted" text-anchor="start">The tops of things: roofs and tree crowns.</text>
<text x="560" y="246.0" font-size="13" class="muted" text-anchor="start">Roofs are fitted to it, trees drafted from it.</text>
<path d="M446.0 323.0 H534" stroke="#95a3a9" stroke-width="1.2" stroke-dasharray="2 4"/>
<circle cx="534" cy="323.0" r="3" fill="#43b9d6"/>
<rect x="546" y="293.0" width="392" height="68" rx="10" class="card"/>
<text x="560" y="315.0" font-size="16" class="title">Ground model</text>
<text x="560" y="335.0" font-size="13" class="muted" text-anchor="start">LiDAR's bare earth on a 1 m grid.</text>
<text x="560" y="352.0" font-size="13" class="muted" text-anchor="start">Everything else stands on it.</text>
<path d="M446.0 429.0 H534" stroke="#95a3a9" stroke-width="1.2" stroke-dasharray="2 4"/>
<circle cx="534" cy="429.0" r="3" fill="#43b9d6"/>
<rect x="546" y="399.0" width="392" height="68" rx="10" class="card"/>
<text x="560" y="421.0" font-size="16" class="title">Parcel and buildings</text>
<text x="560" y="441.0" font-size="13" class="muted" text-anchor="start">Where the lot is, and the outlines of the</text>
<text x="560" y="458.0" font-size="13" class="muted" text-anchor="start">buildings. A guide, not a survey.</text>
<rect x="20" y="508" width="920" height="40" rx="10" fill="#173540"/>
<text x="36" y="533" font-size="13">In New Zealand all four come from LINZ's open data. Elsewhere Domus uses OpenStreetMap and a 30 m ground model, or files of your own.</text>
</svg>
