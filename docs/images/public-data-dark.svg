<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="title desc">
<title id="title">What public data gives a model</title>
<desc id="desc">Four layers stacked like slabs: an aerial photo, a surface model of roofs and trees, the bare ground model with contours, and the parcel with the buildings' outlines.</desc>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; fill: #dde6e9; }
.mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
.muted { fill: #95a3a9; }
.title { font-weight: 650; }
.card { fill: #141c20; stroke: #2a363c; stroke-width: 1.2; }

@media (prefers-reduced-motion: no-preference) { .layer { animation: float 7s ease-in-out infinite; } }
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }

</style>
