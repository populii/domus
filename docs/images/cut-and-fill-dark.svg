<g font-size="13" font-weight="700">
<text class="t-now" x="930" y="28" text-anchor="end" fill="#95a3a9">the ground as it is</text>
<text class="t-scheme" x="930" y="28" text-anchor="end" fill="#43b9d6">with a wall scheme</text>
</g>
<g font-size="13">
<rect x="20" y="334" width="920" height="36" rx="10" fill="#173540"/>
<text x="36" y="357">For every scheme Domus works out the cut and fill, the area disturbed, each wall’s heights, and the flat lawn before and after.</text>
</g>
