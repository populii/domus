<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" role="img" aria-labelledby="title desc">
<title id="title">Cut and fill</title>
<desc id="desc">A cross-section of sloping ground beside a house. A level lawn is cut into the high side and filled on the low side, held by a retaining wall at its low edge, with a sloping batter where no wall holds it.</desc>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; fill: #dde6e9; }
.mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
.muted { fill: #95a3a9; }
.title { font-weight: 650; }
.card { fill: #141c20; stroke: #2a363c; stroke-width: 1.2; }

.t-now { opacity: 0; }
@media (prefers-reduced-motion: no-preference) {
  .scheme { animation: scheme 9s ease-in-out infinite; }
  .t-scheme { animation: scheme 9s ease-in-out infinite; }
  .t-now { animation: now 9s ease-in-out infinite; }
}
@keyframes scheme { 0%, 12% { opacity: 0; } 24%, 88% { opacity: 1; } 100% { opacity: 0; } }
@keyframes now { 0%, 12% { opacity: 1; } 24%, 88% { opacity: 0; } 100% { opacity: 1; } }

</style>
