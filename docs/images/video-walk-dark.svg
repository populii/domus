<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="title desc">
<title id="title">The video walk</title>
<desc id="desc">Left: a plan of a lot with the suggested walking route, round the edge, to the trees and the steep bank, then round the house. Right: what happens to the video, in five steps from filming to a cloud in the model.</desc>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; fill: #dde6e9; }
.mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
.muted { fill: #95a3a9; }
.title { font-weight: 650; }
.card { fill: #141c20; stroke: #2a363c; stroke-width: 1.2; }

.dot { fill: #173540; }
.dotn { fill: #43b9d6; }
.walker { offset-path: path("M68.0 58.0 L185.0 61.0 L267.5 64.0 L293.0 103.0 L267.5 64.0 L335.0 67.0 L338.0 235.0 L339.5 400.0 L230.0 403.0 L215.0 388.0 L230.0 403.0 L71.0 409.0 L69.5 235.0 L68.0 122.5 L98.0 100.0 L68.0 122.5 L68.0 154.0 L89.0 154.0 L296.0 154.0 L296.0 346.0 L89.0 346.0 L89.0 154.0"); offset-rotate: 0deg; offset-distance: 0%; }
.draw { stroke-dasharray: 1000; stroke-dashoffset: 0; }
@media (prefers-reduced-motion: no-preference) {
  .walker { animation: walk 12s linear infinite; }
  .draw { animation: draw 12s linear infinite; }
  .pipe .ring { animation: glow 12s ease-in-out infinite; animation-delay: inherit; }
  .pipe .dot { animation: dot 12s ease-in-out infinite; animation-delay: inherit; }
  .pipe .dotn { animation: dotn 12s ease-in-out infinite; animation-delay: inherit; }
}
@keyframes walk { from { offset-distance: 0%; } 92% { offset-distance: 100%; } to { offset-distance: 100%; } }
@keyframes draw { from { stroke-dashoffset: 1000; } 92% { stroke-dashoffset: 0; } to { stroke-dashoffset: 0; } }
@keyframes glow { 0%, 20%, 100% { stroke: #2a363c; stroke-width: 1.2; } 5%, 15% { stroke: #43b9d6; stroke-width: 2.4; } }
@keyframes dot { 0%, 20%, 100% { fill: #173540; } 5%, 15% { fill: #43b9d6; } }
@keyframes dotn { 0%, 20%, 100% { fill: #43b9d6; } 5%, 15% { fill: #062027; } }

</style>
