<text x="89.0" y="158.5" font-size="12" font-weight="700" text-anchor="middle">5</text>
<g class="walker">
<circle r="7" fill="#43b9d6"/>
<circle r="12" fill="none" stroke="#43b9d6" stroke-width="1.5" opacity="0.5"/>
</g>
<text x="192.5" y="255.0" font-size="12" text-anchor="middle" fill="#141c20" font-weight="600">house</text>
<text x="200.0" y="418.0" font-size="12" text-anchor="middle" class="muted">steep bank</text>
<text x="36" y="472" font-size="12.5" class="muted" text-anchor="start">Domus suggests the route: the lot's edge, a detour to</text>
<text x="36" y="488" font-size="12.5" class="muted" text-anchor="start">each place the LiDAR sees worst, then round the house.</text>
<g class="pipe" style="animation-delay:0.0s">
<rect x="420" y="16" width="520" height="92" rx="12" class="card ring"/>
<circle cx="450" cy="62.0" r="16" class="dot"/>
<text x="450" y="67.0" font-size="14" font-weight="700" text-anchor="middle" class="dotn">1</text>
<text x="480" y="44" font-size="16" class="title">Film it</text>
<text x="926" y="44" font-size="12.5" class="mono muted" text-anchor="end">your phone</text>
<text x="480" y="66" font-size="13" class="muted" text-anchor="start">Slowly, on one lens, turning gradually.</text>
<text x="480" y="83" font-size="13" class="muted" text-anchor="start">Say what you're looking at as you go.</text>
</g>
<path d="M450 80.0 V140.0" stroke="#43b9d6" stroke-width="2" stroke-dasharray="3 4"/>
<g class="pipe" style="animation-delay:2.4s">
<rect x="420" y="112" width="520" height="92" rx="12" class="card ring"/>
<circle cx="450" cy="158.0" r="16" class="dot"/>
<text x="450" y="163.0" font-size="14" font-weight="700" text-anchor="middle" class="dotn">2</text>
<text x="480" y="140" font-size="16" class="title">Frames</text>
<text x="926" y="140" font-size="12.5" class="mono muted" text-anchor="end">domus video frames</text>
<text x="480" y="162" font-size="13" class="muted" text-anchor="start">The sharpest frame in every sixth of</text>
<text x="480" y="179" font-size="13" class="muted" text-anchor="start">a second, named by its time in the clip.</text>
</g>
<path d="M450 176.0 V236.0" stroke="#43b9d6" stroke-width="2" stroke-dasharray="3 4"/>
<g class="pipe" style="animation-delay:4.8s">
<rect x="420" y="208" width="520" height="92" rx="12" class="card ring"/>
<circle cx="450" cy="254.0" r="16" class="dot"/>
<text x="450" y="259.0" font-size="14" font-weight="700" text-anchor="middle" class="dotn">3</text>
<text x="480" y="236" font-size="16" class="title">Reconstruct</text>
<text x="926" y="236" font-size="12.5" class="mono muted" text-anchor="end">domus video reconstruct</text>
<text x="480" y="258" font-size="13" class="muted" text-anchor="start">COLMAP finds where each frame was</text>
<text x="480" y="275" font-size="13" class="muted" text-anchor="start">taken from, and a cloud of points.</text>
</g>
<path d="M450 272.0 V332.0" stroke="#43b9d6" stroke-width="2" stroke-dasharray="3 4"/>
<g class="pipe" style="animation-delay:7.2s">
<rect x="420" y="304" width="520" height="92" rx="12" class="card ring"/>
<circle cx="450" cy="350.0" r="16" class="dot"/>
<text x="450" y="355.0" font-size="14" font-weight="700" text-anchor="middle" class="dotn">4</text>
<text x="480" y="332" font-size="16" class="title">Place</text>
<text x="926" y="332" font-size="12.5" class="mono muted" text-anchor="end">domus video place</text>
<text x="480" y="354" font-size="13" class="muted" text-anchor="start">Points you mark in frames, held to known</text>
<text x="480" y="371" font-size="13" class="muted" text-anchor="start">places, put the cloud on the site's grid.</text>
</g>
<path d="M450 368.0 V428.0" stroke="#43b9d6" stroke-width="2" stroke-dasharray="3 4"/>
<g class="pipe" style="animation-delay:9.6s">
<rect x="420" y="400" width="520" height="92" rx="12" class="card ring"/>
<circle cx="450" cy="446.0" r="16" class="dot"/>
<text x="450" y="451.0" font-size="14" font-weight="700" text-anchor="middle" class="dotn">5</text>
<text x="480" y="428" font-size="16" class="title">Into the model</text>
<text x="926" y="428" font-size="12.5" class="mono muted" text-anchor="end">dense, export, build</text>
<text x="480" y="450" font-size="13" class="muted" text-anchor="start">A denser cloud, in the viewer with</text>
<text x="480" y="467" font-size="13" class="muted" text-anchor="start">everything else, to measure against.</text>
</g>
</svg>
