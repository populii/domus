<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="title desc">
<title id="title">Common and site</title>
<desc id="desc">Two cards. Common, Domus itself, holds the commands, the viewer, the public API and the made-up sites. Your site, one property's private folder, holds its settings, layers, rasters, wall options, sources, its own tools and tests and its notes. Common reads and builds the site; a site tool that proves general moves into common.</desc>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; fill: #1b2733; }
.mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
.muted { fill: #5d6871; }
.title { font-weight: 650; }
.card { fill: #f8f9f6; stroke: #cfd5d3; stroke-width: 1.2; }

.chip { offset-path: path("M700 392 C700 440 300 446 236 394"); offset-rotate: 0deg; offset-distance: 0%; opacity: 0; }
@media (prefers-reduced-motion: no-preference) { .chip { animation: graduate 9s ease-in-out infinite; } }
@media (prefers-reduced-motion: reduce) { .chip { opacity: 1; offset-distance: 50%; } }
@keyframes graduate { 0%, 10% { offset-distance: 0%; opacity: 0; } 18% { opacity: 1; } 70% { offset-distance: 100%; opacity: 1; }
  80%, 100% { offset-distance: 100%; opacity: 0; } }

</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10 Z" fill="#0e6f86"/>
</marker>
<marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10 Z" fill="#a8560c"/>
</marker>
</defs>
<rect x="20" y="20" width="410" height="372" rx="16" class="card"/>
<text x="44" y="56" font-size="19" class="title">Common: Domus itself</text>
<text x="44" y="78" font-size="13" class="muted">For any property, anywhere. What the container runs.</text>
<circle cx="52" cy="107" r="6" fill="#0e6f86"/>
<text x="70" y="112" font-size="15" class="title">Commands</text>
<text x="70" y="131" font-size="13" class="muted" text-anchor="start">create, new, fetch, build, export,</text>
<text x="70" y="148" font-size="13" class="muted" text-anchor="start">video, prep, site, shots, serve</text>
<circle cx="52" cy="177" r="6" fill="#0e6f86"/>
<text x="70" y="182" font-size="15" class="title">The viewer</text>
<text x="70" y="201" font-size="13" class="muted" text-anchor="start">One page in your browser. It loads</text>
<text x="70" y="218" font-size="13" class="muted" text-anchor="start">nothing from other hosts.</text>
<circle cx="52" cy="247" r="6" fill="#0e6f86"/>
<text x="70" y="252" font-size="15" class="title">The public API</text>
<text x="70" y="271" font-size="13" class="muted" text-anchor="start">domus.api and domus.testing, kept</text>
<text x="70" y="288" font-size="13" class="muted" text-anchor="start">working from release to release.</text>
<circle cx="52" cy="317" r="6" fill="#0e6f86"/>
<text x="70" y="322" font-size="15" class="title">Made-up sites</text>
<text x="70" y="341" font-size="13" class="muted" text-anchor="start">Every test and picture uses them,</text>
<text x="70" y="358" font-size="13" class="muted" text-anchor="start">never a real place.</text>
<rect x="530" y="20" width="410" height="372" rx="16" class="card"/>
<text x="554" y="56" font-size="19" class="title">Your site: one property</text>
<text x="554" y="78" font-size="13" class="muted">A folder of its own. Private by default.</text>
<text x="554" y="112" font-size="14" class="mono">site/</text>
<text x="560" y="140" font-size="14" class="mono muted">├─</text>
<text x="586" y="140" font-size="13.5" class="mono">data/site.toml</text>
<text x="586" y="155" font-size="12" class="muted">settings</text>
<text x="560" y="173" font-size="14" class="mono muted">├─</text>
<text x="586" y="173" font-size="13.5" class="mono">data/site/*.geojson</text>
<text x="586" y="188" font-size="12" class="muted">the layers you curate</text>
<text x="560" y="206" font-size="14" class="mono muted">├─</text>
<text x="586" y="206" font-size="13.5" class="mono">data/lidar/, data/aerial/</text>
<text x="586" y="221" font-size="12" class="muted">ground, surface, photo</text>
<text x="560" y="239" font-size="14" class="mono muted">├─</text>
<text x="586" y="239" font-size="13.5" class="mono">options/*.toml</text>
<text x="586" y="254" font-size="12" class="muted">wall schemes</text>
<text x="560" y="272" font-size="14" class="mono muted">├─</text>
<text x="586" y="272" font-size="13.5" class="mono">sources/raw/</text>
<text x="586" y="287" font-size="12" class="muted">documents and videos</text>
<text x="560" y="305" font-size="14" class="mono muted">├─</text>
<text x="586" y="305" font-size="13.5" class="mono">tools/, tests/</text>
<text x="586" y="320" font-size="12" class="muted">code just for this site</text>
<text x="560" y="338" font-size="14" class="mono muted">└─</text>
<text x="586" y="338" font-size="13.5" class="mono">AGENTS.md</text>
<text x="586" y="353" font-size="12" class="muted">notes only it needs</text>
<g transform="translate(900 50)">
<rect x="-10" y="-4" width="20" height="16" rx="3" fill="#0e6f86"/>
<path d="M-6 -4 V-9 A6 6 0 0 1 6 -9 V-4" fill="none" stroke="#0e6f86" stroke-width="2.4"/>
</g>
<path d="M530 168 H438" fill="none" stroke="#0e6f86" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="480" y="140" font-size="11.5" text-anchor="middle" class="muted">its tools and</text>
<text x="480" y="155" font-size="11.5" text-anchor="middle" class="muted">tests use the API</text>
<path d="M430 262 H522" fill="none" stroke="#0e6f86" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="480" y="234" font-size="11.5" text-anchor="middle" class="muted">domus build</text>
<text x="480" y="249" font-size="11.5" text-anchor="middle" class="muted">makes its model</text>
<path id="grad" d="M700 392 C700 440 300 446 236 394" fill="none" stroke="#a8560c" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow2)"/>
<g class="chip">
<rect x="-34" y="-11" width="68" height="22" rx="11" fill="#f6e7d4" stroke="#a8560c" stroke-width="1.4"/>
<text x="0" y="4.5" font-size="11.5" text-anchor="middle" class="mono" fill="#a8560c">a tool</text>
</g>
<rect x="300" y="436" width="360" height="26" rx="8" fill="#f6e7d4"/>
<text x="480" y="454" font-size="12.5" text-anchor="middle" fill="#a8560c">A site tool that proves general moves into common</text>
</svg>
