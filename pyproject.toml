[project]
name = "domus"
dynamic = ["version"]
description = "3D site models from LINZ LiDAR for comparing retaining wall options, viewed in the browser"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.1",
    "scipy>=1.14",
    "pillow>=11",
    "pyproj>=3.7",
    "rasterio>=1.4",
    "shapely>=2.0",
    "opencv-python-headless>=4.10",
    "av>=14",
    "pycolmap>=4.2",
    "laspy[lazrs]>=2.7.0",
    "tomlkit>=0.13",
]

[project.urls]
Homepage = "https://github.com/populii/domus"
Issues = "https://github.com/populii/domus/issues"
Changelog = "https://github.com/populii/domus/blob/main/CHANGELOG.md"

[project.optional-dependencies]
plans = ["pdfplumber>=0.11"]
ifc = ["ifcopenshell>=0.9.0.post1"]
shots = ["playwright>=1.65.2"]     # domus shots: Playwright drives its own Chromium (uv run playwright install chromium)

[project.scripts]
domus = "domus.cli:main"

[dependency-groups]
dev = [
    "import-linter>=2.1",
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/domus/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/domus"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
extend-exclude = ["src/domus/viewer/vendor"]

[tool.ruff.lint]
# int(round(x)) is kept on purpose: x is often a NumPy scalar.
ignore = ["RUF046"]

# Import rules, checked in CI (uv run lint-imports). See ARCHITECTURE.md.
[tool.importlinter]
root_package = "domus"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The server uses the standard library only, and runs builds and jobs in processes of their own"
type = "forbidden"
source_modules = ["domus.serve"]
forbidden_modules = ["numpy", "scipy", "shapely", "rasterio", "pyproj", "PIL", "cv2", "av", "pycolmap", "laspy", "tomlkit",
                     "domus.geo.crs", "domus.build", "domus.options.design", "domus.model.terrain"]

[[tool.importlinter.contracts]]
name = "The model's pure parts read no site and know nothing of the app"
type = "forbidden"
source_modules = ["domus.model.house", "domus.model.house_texture", "domus.geo.mesh", "domus.model.wall_looks",
                  "domus.model.walls", "domus.model.features", "domus.model.drains", "domus.model.tin",
                  "domus.model.vegetation", "domus.options.scheme"]
forbidden_modules = ["domus.geo.crs", "domus.api", "domus.build", "domus.cli", "domus.serve", "domus.create",
                     "domus.options.design", "domus.options.sketch", "domus.project"]

[[tool.importlinter.contracts]]
name = "The pure layers read no site: geo, the model's pure parts and the options' working out are handed what they need"
type = "forbidden"
source_modules = ["domus.geo", "domus.model.house", "domus.model.house_texture", "domus.model.wall_looks", "domus.model.walls",
                  "domus.model.features", "domus.model.drains", "domus.model.tin", "domus.model.vegetation",
                  "domus.options.scheme"]
forbidden_modules = ["domus.project", "domus.api", "domus.testing", "domus.build", "domus.cli", "domus.serve", "domus.create",
                     "domus.shots", "domus.export", "domus.model.terrain", "domus.model.canopy", "domus.options.design",
                     "domus.options.sketch", "domus.checks", "domus.capture", "domus.prep", "domus.importers"]
# geo's names from before Domus handed its parts their site (crs.ROOT, crs.settings(), raster.DEM, raster.dem() and the
# rest, deprecated) give the current site's through these imports alone, until they're removed.
ignore_imports = ["domus.geo.crs -> domus.project.site", "domus.geo.raster -> domus.project.site",
                  "domus.geo.raster -> domus.project.rasters"]

[[tool.importlinter.contracts]]
name = "Only the command line imports the server, and nothing imports the command line"
type = "forbidden"
source_modules = ["domus.**"]
forbidden_modules = ["domus.cli", "domus.serve"]
ignore_imports = ["domus.cli -> domus.serve"]
